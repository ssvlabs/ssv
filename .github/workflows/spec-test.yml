name: Spec tests

on:
  push:
    branches:
      - stage
      - main
  pull_request:
    types: [opened, synchronize]

  workflow_dispatch:

jobs:
  spec-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # Keep setup-go cache disabled and use explicit actions/cache below so keying/restore
          # behavior is consistent across workflows.
          cache: false

      - name: Restore Go cache (spec)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-spec-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-spec-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache generated spec artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/spec-tests
          key: ${{ runner.os }}-spec-artifacts-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-spec-artifacts-

      - name: Run spec tests
        run: make spec-test
        env:
          SSV_SPEC_CACHE_DIR: ${{ github.workspace }}/.cache/spec-tests
        timeout-minutes: 80

  # Same suite with the global TestNetwork flipped to post-Boole (fork active from genesis),
  # so fork-gated spec paths that default to pre-fork also run in CI.
  spec-test-boole-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # Keep setup-go cache disabled and use explicit actions/cache below so keying/restore
          # behavior is consistent across workflows.
          cache: false

      - name: Restore Go cache (spec)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-spec-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-spec-
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Cache generated spec artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/spec-tests
          key: ${{ runner.os }}-spec-artifacts-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-spec-artifacts-

      - name: Run spec tests (post-Boole TestNetwork)
        run: make spec-test
        env:
          SSV_SPEC_CACHE_DIR: ${{ github.workspace }}/.cache/spec-tests
          SSV_TEST_BOOLE_FORK: post
        timeout-minutes: 80
