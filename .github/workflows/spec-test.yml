name: Spec tests

on:
  push:
    branches:
      - stage
      - main
  pull_request:
    types: [opened, synchronize]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup make
        run: sudo apt-get update && sudo apt-get install make

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            ssvsigner/go.sum

      - name: Cache generated spec artifacts
        uses: actions/cache@v4
        with:
          path: .cache/spec-tests
          key: ${{ runner.os }}-spec-artifacts-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-spec-artifacts-

      - name: Run spec tests
        run: make spec-test
        env:
          SSV_SPEC_CACHE_DIR: ${{ github.workspace }}/.cache/spec-tests
        timeout-minutes: 80
