name: Unit tests


on:
  push:
    branches:
      - stage
      - main
  pull_request:
    types: [opened, synchronize]

  workflow_dispatch:

jobs:
  ssv-unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fork: [pre, post]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup make
        run: sudo apt-get update && sudo apt-get install make

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run unit tests (ssv)
        env:
          SSV_TEST_BOOLE_FORK: ${{ matrix.fork }}
        run: make unit-test-ssv

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: all,ssv,boole_${{ matrix.fork }}
          name: ssv-unit-${{ matrix.fork }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ssvsigner-unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup make
        run: sudo apt-get update && sudo apt-get install make

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run unit tests (ssvsigner)
        run: make ssvsigner-test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./ssvsigner/coverage.out
          flags: all,ssvsigner
          name: ssvsigner-unit
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
