\* TLC config for BareOBFT_Liveness_NoBudget at n=4, f=1, K=2.
\*
\* Sibling of BareOBFT_Liveness.cfg with the same Operators / Byzantine
\* constants but K=2 (vs the within-budget spec's K=4) — the relaxed-
\* delivery branching factor (2^n choices per honest leader broadcast)
\* dominates the state space and makes K=4 intractable without state-
\* constraint pruning.
\*
\* The spec itself relaxes the within-budget Assumption-2 axiom — honest
\* leaders may have ANY delivery subset (with leader retaining own bundle).
\*
\* Per-§5.4 expectation: LIVENESS_NON_GRIEF is EXPECTED TO FAIL under this
\* model.  Each counterexample = a Class A deadlock pattern documented in
\* OBFT.md §Failure modes (partial-propagation deadlock from the h_V=1
\* family, asymmetric propagation past T_commit, etc.).
\*
\* Run:
\*   cd tla && ./scripts/tlc-run.sh BareOBFT_Liveness_NoBudget
\* (no make target yet — invoke runner directly)
\*
\* State-space caveat: relaxed delivery adds ~2^n choices per honest
\* leader broadcast.  At K=2 expected ~1-10M states.  Higher K may need
\* state-constraint pruning.

SPECIFICATION Spec

INVARIANT TypeOK

PROPERTY LIVENESS_NON_GRIEF

\* Disable TLC's deadlock check — our spec naturally terminates when all
\* honest reconstructions are done OR all enabled actions exhausted.
CHECK_DEADLOCK FALSE

CONSTANTS
    Operators = {op1, op2, op3, op4}
    Byzantine = {op4}
    K = 2

\* SYMMETRY disabled: TLC warns symmetry under liveness checking can miss
\* violations.  We want every counterexample TLC finds, so symmetry off.
\* SYMMETRY Symmetry
