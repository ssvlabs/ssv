\* TLC config for LBid_Safety at n=4, f=1, K=2, |Values|=2.
\*
\* Mirrors BareOBFT_Safety.cfg's scale plus L_Bid's three additional
\* state variables (lbid_sigma, lbid_nr, verdicts).  At this size:
\*   qV = qEnc = 2*1+1 = 3.
\*   |Operators| = 4, |Honest| = 3, |Byzantine| = 1.
\*   Rotation layer space: 0..1 (2 layers); plus L_Bid as outermost gate.
\*   Value space: {v1, v2}.
\*
\* State space estimate: bare OBFT was 262K states at this config; L_Bid
\* extension adds verdicts + L_Bid σ/NR variables, expanding the per-bare-
\* state factor by ~10-100x.  Expected runtime: minutes.  If too slow,
\* consider applying TLC symmetry reductions (EXTENDS TLC + Permutations
\* over Honest and Values).
\*
\* Run:
\*   /opt/homebrew/opt/openjdk/bin/java -cp tla2tools.jar tlc2.TLC \
\*     -config LBid_Safety.cfg LBid_Safety
\*
\* Expected: "Model checking completed. No error has been found."  TLC
\* verifies SAFETY (Pigeonholes 1, 2, 3 + verdict pigeonhole) at every
\* reachable state.

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT Pigeonhole1
INVARIANT Pigeonhole2
INVARIANT Pigeonhole3
INVARIANT PigeonholeVerdicts
INVARIANT SAFETY

\* Disable TLC's deadlock check.  Spec naturally terminates when all
\* possible σ/NR/verdict commitments have been added; TLC otherwise flags
\* this as a "deadlock" (no enabled transition).  We're checking SAFETY
\* invariants at every reachable state, which is the actual property of
\* interest.
CHECK_DEADLOCK FALSE

CONSTANTS
    Operators = {op1, op2, op3, op4}
    Byzantine = {op4}
    K = 2
    Values = {v1, v2}

\* Symmetry reduction — TLC explores one canonical state per equivalence
\* class under permutations of Honest = {op1, op2, op3} and Values =
\* {v1, v2}.  Reduces state space by `Cardinality(Honest)! × Cardinality(
\* Values)! = 3! × 2! = 12`.  The Symmetry operator is defined in
\* LBid_Safety.tla using TLC's Permutations.
SYMMETRY Symmetry
