\* TLC config for LBidNew_Safety at n=4, f=1, K=2, |Values|=2.
\*
\* Mirrors LBid_Safety.cfg's scale and applies the same TLC symmetry
\* reduction (Honest × Values = 12× reduction at this scale).  L_Bid_New
\* SAFETY is a refinement of L_Bid SAFETY at the algebraic level (per-
\* operator σ-or-NR commitments + threshold pools + chained encryption);
\* the L_Bid_New-specific σ-when-uncertain rule and deep-only verdict
\* scope are honest-side tightenings that don't affect Pigeonhole
\* invariants.  See LBidNew_Safety.tla for the reduction argument.
\*
\* State space estimate: similar to LBid_Safety (~100-150M canonical
\* states at this config).  Run for up to 20 min budget; expect partial
\* coverage similar to LBid_Safety unless the run completes naturally.
\*
\* Run:
\*   /opt/homebrew/opt/openjdk/bin/java -Xmx8g -XX:+UseParallelGC \
\*     -cp tla2tools.jar tlc2.TLC -workers auto \
\*     -config LBidNew_Safety.cfg LBidNew_Safety
\*
\* Expected: TLC reports "Model checking completed. No error has been
\* found." for full coverage, or terminates partway with no counterexamples
\* found at the explored depth.

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT Pigeonhole1
INVARIANT Pigeonhole2
INVARIANT Pigeonhole3
INVARIANT PigeonholeVerdicts
INVARIANT SAFETY

\* Disable TLC's deadlock check.  Spec naturally terminates when all
\* possible σ/NR/verdict commitments have been added; TLC otherwise flags
\* this as a "deadlock" (no enabled transition).  We're checking SAFETY
\* invariants at every reachable state, which is the actual property of
\* interest.
CHECK_DEADLOCK FALSE

CONSTANTS
    Operators = {op1, op2, op3, op4}
    Byzantine = {op4}
    K = 2
    Values = {v1, v2}

SYMMETRY Symmetry
