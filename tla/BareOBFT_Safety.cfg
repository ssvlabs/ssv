\* per-operator views with byz selective delivery (full GRIEF), P1 mutex
\* holds via the algebraic-cardinality argument: σ-flip needs nr_h ≤ f,
\* NR-flip needs s_h < f, but s_h + nr_h = 2f at n=3f+1.  TLC corroborates.

