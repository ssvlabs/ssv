\* TLC config for BareOBFT_Safety at n=4, f=1, K=2, |Values|=2.
\*
\* Smallest non-trivial cluster (4 operators, 1 byz, 2 layers, 2 candidate
\* values).  At this size:
\*   qV = qEnc = 2*1+1 = 3.
\*   |Operators| = 4, |Honest| = 3, |Byzantine| = 1.
\*   Layer space: 0..1 (2 layers).
\*   Value space: {v1, v2}.
\*
\* Estimated state space: ~256K states.  TLC should run in seconds.
\*
\* Run:
\*   java -cp $TLA_TOOLS tlc2.TLC -config BareOBFT_Safety.cfg BareOBFT_Safety
\*
\* Expected: "Model checking completed. No error has been found."  TLC verifies
\* SAFETY (Pigeonholes 1, 2, 3) at every reachable state.

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SAFETY

\* Disable TLC's deadlock check.  Our spec naturally terminates when all
\* possible σ/NR commitments have been added; TLC otherwise flags this as
\* a "deadlock" (no enabled transition).  We're checking SAFETY invariants
\* at every reachable state, which is the actual property of interest.
CHECK_DEADLOCK FALSE

CONSTANTS
    Operators = {op1, op2, op3, op4}
    Byzantine = {op4}
    K = 2
    Values = {v1, v2}

\* Symmetry reduction (honest operators are role-symmetric) deferred — requires
\* `EXTENDS TLC` in the .tla file plus a SymmetricSet definition.  Add after
\* verifying basic spec runs cleanly.
