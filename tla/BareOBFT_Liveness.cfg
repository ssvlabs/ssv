\* TLC config for BareOBFT_Liveness at n=4, f=1, K=4.
\*
\* Verifies LIVENESS_NON_GRIEF (Class A closure under non-grief + within-
\* budget partial-synchrony) for bare OBFT.  Action space:
\*   - honest: §3.2 honest state machine
\*   - byz leader: all-or-nothing broadcast (= Operators or ∅; selective
\*     proper-subset broadcast is reclassified as grief and excluded)
\*   - byz non-leader: σ / NR / silent commitment per layer (subject to
\*     honest XOR — no σ AND NR at same layer; that's grief)
\*
\* Symmetry over Honest would reduce canonical state count by 3! = 6×,
\* but is disabled here per liveness caveat — see SYMMETRY line below.
\*
\* Per-§5.2 expectation: Class A closure SHOULD hold for bare OBFT.  If
\* TLC finds a counterexample, it surfaces a Class A deadlock requiring
\* either protocol fix or grief-classification update.
\*
\* Run:
\*   cd tla && make verify-bareliveness
\* (or directly: ./scripts/tlc-run.sh BareOBFT_Liveness)
\*
\* Liveness checking is more expensive than safety; expect minutes-to-hour
\* runtime depending on state-space size.

SPECIFICATION Spec

INVARIANT TypeOK

PROPERTY LIVENESS_NON_GRIEF

\* Disable TLC's deadlock check — our spec naturally terminates when all
\* honest reconstructions are done.
CHECK_DEADLOCK FALSE

CONSTANTS
    Operators = {op1, op2, op3, op4}
    Byzantine = {op4}
    K = 4

\* SYMMETRY disabled: TLC warns symmetry under liveness checking can miss
\* violations.  State space is small enough to verify without it.
\* SYMMETRY Symmetry
