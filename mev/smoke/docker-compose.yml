services:
  relay_a:
    build:
      context: ../..
      dockerfile: mev/smoke/Dockerfile
    command:
      - /app/mev-mock-relay
      - -listen=:18551
      - -id=relay_a
      - -bid-enabled=true
      - -bid-value-wei=100
    expose:
      - "18551"

  relay_b:
    build:
      context: ../..
      dockerfile: mev/smoke/Dockerfile
    command:
      - /app/mev-mock-relay
      - -listen=:18552
      - -id=relay_b
      - -bid-enabled=true
      - -bid-value-wei=200
    expose:
      - "18552"

  builder:
    build:
      context: ../..
      dockerfile: mev/smoke/Dockerfile
    command:
      - /app/mev-builder-smoke
      - -listen=:18550
      - -relays=http://relay_a:18551,http://relay_b:18552
      - -relay-timeout=750ms
      - -bid-deadline=750ms
      - -bid-gap=50ms
      - -cache-ttl=2s
      - -prefetch-max-in-flight=4
    ports:
      - "18550:18550"
    depends_on:
      - relay_a
      - relay_b

  smoke:
    build:
      context: ../..
      dockerfile: mev/smoke/Dockerfile
    command:
      - /app/mev-smoke-client
      - -builder-url=http://builder:18550
      - -expected-best-bid-wei=200
    depends_on:
      - builder

