global:
  # Console log level (debug, info, warn, error, fatal, panic)
  LogLevel: info
  
  # Debug logs file path
  LogFilePath: ./data/debug.log

db:
  # Path to a persistent directory to store the node's database.
  Path: ./data/db

ssv:
  # The SSV network to join to
  # Mainnet = Network: mainnet (default)
  # Testnet = Network: holesky
  Network: mainnet

eth2:
  # HTTP URL of the Beacon node to connect to.
  BeaconNodeAddr: http://example.url:5052

  # Block-fetch path tuning. The SSV node selects one of three paths at startup based on
  # the settings below; see docs/MEV_CONSIDERATIONS.md for the full model.
  #
  # ProposalSoftDeadline opts the SSV node into the MEV-optimized path: SSV waits for all
  # multi-BN responses until this slot-relative deadline (ms into slot) and returns the
  # highest-value bid received, without early-exiting on the first MEV block. Match this
  # to your PBS late_in_slot_time_ms + ~50ms BN→SSV transport. Valid range: [1000ms,
  # 3600ms]; values above 1800ms emit a startup warning (round-2 QBFT fallback no longer
  # fits within the slot). Cannot be combined with ProposerDelay or ProposalSoftTimeout.
  # Leave unset to use the default safe path (early-exit on first MEV block, deadline 1000ms).
  # ProposalSoftDeadline: 1100ms

  # ProposalSoftTimeout (legacy): collection-period timeout for multi-BN proposal scoring
  # in the legacy block-fetch path. Setting this (or ProposerDelay below) opts into the
  # legacy path. New operators should leave this unset and use ProposalSoftDeadline above.
  # ProposalSoftTimeout: 1800ms

  ValidatorOptions:

eth1:
  # WebSocket URL of the Eth1 node to connect to.
  ETH1Addr: ws://example.url:8546/ws

p2p:
  # Optionally specify the external IP address of the node, if it cannot be determined automatically.
  # HostAddress: 192.168.1.1

  # Optionally override the default TCP & UDP ports of the node.
  # TcpPort: 13001
  # UdpPort: 12001

# Note: Operator private key can be generated with the `generate-operator-keys` command.
OperatorPrivateKey:

# MEV Configuration (Optional)
# Recommended approach: configure timing games on the PBS layer (mev-boost v1.11+ launched
# with -config, or commit-boost). With PBS-side timing games configured, leave ProposerDelay
# at its default value of 0. See docs/MEV_CONSIDERATIONS.md for details.
#
# ProposerDelay is the legacy SSV-side lever — a delay before requesting the block-proposal,
# extracting higher MEV by waiting for better bids. Use this only when your PBS does not
# support timing games. Default is 0 (no delay).
# ProposerDelay: 300ms

# Safety flag to allow ProposerDelay values higher than 1000ms.
# WARNING: Values above 1000ms significantly increase the risk of missing block proposals!
# Only set to true if you understand the risks and have carefully read the MEV documentation.
# AllowDangerousProposerDelay: false

# This enables monitoring at the specified port, see https://github.com/ssvlabs/ssv/tree/main/monitoring
MetricsAPIPort: 15000

# This enables Open Telemetry traces
EnableTraces: false

# These settings enable the SSV API at the specified address+port. Refer to the documentation at https://bloxapp.github.io/ssv/
# Prefer 127.0.0.1 and listen on all interfaces only when remote access is intentional and protected by network controls (to prevent potential resource-intensive attacks).
# If SSVAPIAddress is omitted, the API listens on all interfaces (for backward compatibility).
# SSVAPIAddress: 127.0.0.1
# SSVAPIPort: 16000
