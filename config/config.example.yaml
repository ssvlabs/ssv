global:
  # Console log level (debug, info, warn, error, fatal, panic)
  LogLevel: info
  
  # Debug logs file path
  LogFilePath: ./data/debug.log

db:
  # Path to a persistent directory to store the node's database.
  Path: ./data/db

ssv:
  # The SSV network to join to
  # Mainnet = Network: mainnet (default)
  # Testnet = Network: holesky
  Network: mainnet

eth2:
  # HTTP URL of the Beacon node to connect to.
  BeaconNodeAddr: http://example.url:5052

  ValidatorOptions:

eth1:
  # WebSocket URL of the Eth1 node to connect to.
  ETH1Addr: ws://example.url:8546/ws

p2p:
  # Optionally specify the external IP address of the node, if it cannot be determined automatically.
  # HostAddress: 192.168.1.1

  # Optionally override the default TCP & UDP ports of the node.
  # TcpPort: 13001
  # UdpPort: 12001

  # Optionally surface networking debug logs through the SSV logger (all off by default;
  # enable individually when troubleshooting connectivity):
  # PubSubTrace: true      # gossipsub (pubsub) debug tracing
  # DiscoveryTrace: true   # discv5 discovery debug tracing
  # Libp2pTrace: true      # go-libp2p logs, swarm2 & basichost at debug (replaces GOLOG_LOG_LEVEL)

# Note: Operator private key can be generated with the `generate-operator-keys` command.
OperatorPrivateKey:

# MEV Configuration (Optional)
# Duration to wait before requesting block proposal if this operator is proposer-duty Leader.
# This allows extracting higher MEV by waiting for better bids. Default is 0 (no delay).
# Recommended starting value: 300ms. See docs/MEV_CONSIDERATIONS.md for details.
# ProposerDelay: 300ms

# Safety flag to allow ProposerDelay values higher than 1s.
# WARNING: Values above 1s significantly increase the risk of missing block proposals!
# Only set to true if you understand the risks and have carefully read the MEV documentation.
# AllowDangerousProposerDelay: false

# Post-ePBS (Gloas) counterpart of ProposerDelay, applied from the Gloas fork on (ProposerDelay applies
# before it). Hard-capped at 1s with no dangerous override. Default is 0 (opt-in). Gloas is not active on
# mainnet yet; tune only after validating on a Gloas network. See docs/MEV_CONSIDERATIONS.md.
# ProposerDelayEPBS: 0

# Post-ePBS (Gloas) direct-builder connections — an opt-in overlay on top of the enshrined builder flow
# (which needs no configuration and stays the fallback). The whole block MUST be configured identically
# across ALL operators of every committee sharing a validator: AuthData (defaulting to the UTF-8 bytes of
# URL, exactly as written) is threshold-signed, so any divergence silently disables that builder. At most 8
# entries. Monetary values are Gwei. The top-level MinBid/BuilderBoostFactor apply to p2p (gossiped) bids
# and, per keymanager-APIs#88, are the default for any entry that omits its own. The bid-selection knobs
# are sent on the produceBlockV4 POST and honored by beacon nodes that implement it (beacon-APIs#630);
# against an older node the request falls back to GET, where only BuilderBoostFactor still applies (MinBid
# and the per-entry knobs are POST-only). See docs/EXTERNAL_BUILDERS.md.
# Builders:
#   MinBid: 0                        # p2p-bid floor + default for entries below; 0 = no floor
#   BuilderBoostFactor: 100          # p2p-bid multiplier % + default; 0 = always local, 100 = neutral
#   Entries:
#     - URL: "https://builder.example.com"
#       # AuthData: "0x..."          # omit to default to the URL bytes
#       # BuilderPubKeys: ["0x..."]  # optionally pin the builder's bid-signing key(s); empty = any
#       # MaxExecutionPayment: 0     # cap on trusted execution-layer payment
#       # MinBid: 0                  # optional; inherits the top-level MinBid
#       # BuilderBoostFactor: 100    # optional; inherits the top-level BuilderBoostFactor

# This enables monitoring at the specified port, see https://github.com/ssvlabs/ssv/tree/main/monitoring
MetricsAPIPort: 15000

# This enables Open Telemetry traces
EnableTraces: false

# These settings enable the SSV API at the specified address+port. Refer to the documentation at https://bloxapp.github.io/ssv/
# Prefer 127.0.0.1 and listen on all interfaces only when remote access is intentional and protected by network controls (to prevent potential resource-intensive attacks).
# If SSVAPIAddress is omitted, the API listens on all interfaces (for backward compatibility).
# SSVAPIAddress: 127.0.0.1
# SSVAPIPort: 16000
