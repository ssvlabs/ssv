global:
  LogLevel: debug

db:
  Path: ./data/db

eth2:
  BeaconNodeAddr: example.url
  Network: prater

eth1:
  # ETH1 node WebSocket address
  ETH1Addr: example.url

p2p:
  # replace with your ip
#  HostAddress: example.ip
#  TcpPort:
#  UdpPort:
# mdns for local network setup
#  Discovery: mdns

ssv:
  ValidatorOptions:
    SignatureCollectionTimeout: 5s
    FullNode: true
    Exporter: true

GenerateOperatorPrivateKey: true

bootnode:
  ExternalIP:
  PrivateKey:

LocalEventsPath: # path to local events. used for running the node with custom local events
WebSocketAPIPort: 16000

# This enables Open Telemetry traces
EnableTraces: false

# These settings enable the SSV API at the specified address+port. Refer to the documentation at https://bloxapp.github.io/ssv/
# Prefer 127.0.0.1 and listen on all interfaces only when remote access is intentional and protected by network controls (to prevent potential resource-intensive attacks).
# If SSVAPIAddress is omitted, the API listens on all interfaces (for backward compatibility).
# SSVAPIAddress: 127.0.0.1
# SSVAPIPort: 16000
